# ChangeLedger — repo configuration
# Repo specifics: documentation language, test-first policy, release impact and Git integration.

# Schema version — used to detect and migrate outdated configurations.
# Run `changeledger config migrate --dry-run` to inspect available migrations.
schema_version: 7

# Minimum ChangeLedger CLI version required to work with this repo (SemVer,
# prereleases included). `init` and `config migrate` set it to the version that
# wrote this file; an older installed CLI refuses to run until it is updated.
min_cli_version:

# Language for generated documentation CONTENT. Structure (headings, keys, enums)
# is always English. See `changeledger context spec`.
language: en

# Test-first policy. When true (default), the implementer writes each
# criterion's failing test before the code that makes it pass. Set false for
# exploratory repos. A change may declare `tdd: false` in its frontmatter when
# it delivers no behaviour a test can exercise, and its Log says why. See
# `changeledger context implement`.
tdd: true

# Default SemVer impact for a completed change: none, patch, minor or major.
# A change overrides it with `release_impact` in its frontmatter; an epic
# always weighs `none`, because its children carry the impact.
release:
  default_impact: patch

changes_dir: .changeledger/changes
specs_dir: .changeledger/specs

# Git integration: change branches start from and merge into `integration_branch`; a change with `integrates_into: release` in its frontmatter uses `release_branch` instead.
# `change_branch_format` may use `{type}` and exactly one `{id}`; use null or remove it to opt out.
git:
  integration_branch:
  release_branch:
  change_branch_format: "{type}/{id}"

# Valid lifecycle statuses (order = progress)
statuses: [draft, approved, in-progress, in-review, done, discarded]
