name: Publish

# Publishes to npm when a GitHub Release is published. Uses OIDC trusted
# publishing + provenance — NO long-lived npm token is stored in CI.
#
# One-time setup (npmjs.com, repo owner): configure this package as a Trusted
# Publisher pointing at this repository and the `publish` workflow. With that in
# place and `id-token: write` below, the npm CLI authenticates via OIDC at run
# time; no `NODE_AUTH_TOKEN` secret is needed. Enabling 2FA on the npm account
# is recommended and compatible with trusted publishing.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  # The full matrix runs here, not on every pull request (ci.yml runs Linux
  # only): a release is the one point where macOS and Windows must be proven.
  verify:
    name: verify (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo's ledger lives in refs/heads/changeledger/state; a
          # single-branch checkout runs the suite against a deactivated repo
          # with no ledger.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          git config user.name "changeledger-ci"
          git config user.email "ci@changeledger.invalid"
      - run: node bin/changeledger.mjs activate
      - run: node bin/changeledger.mjs register
      - run: pnpm verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # prepublishOnly runs the full gate against this repo's own ledger,
          # which lives in refs/heads/changeledger/state (20260814-233210 —
          # same environment class ci.yml already fixes).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `activate` records its decision as a git commit; runners carry no
      # git identity to author it with.
      - run: |
          git config user.name "changeledger-ci"
          git config user.email "ci@changeledger.invalid"
      # Seeds the local state ref from the remote-tracking copy and activates
      # this checkout, so the gate validates the real ledger.
      - run: node bin/changeledger.mjs activate
      # A fresh runner refreshes the registry and managed context bootstrap
      # before prepublishOnly executes `changeledger check`.
      - run: node bin/changeledger.mjs register
      # prepublishOnly runs the full quality gate (lint + tests + changeledger check)
      # before anything is uploaded. --provenance attaches a signed build
      # attestation; --access public is required for an unscoped public package.
      - run: npm publish --provenance --access public
