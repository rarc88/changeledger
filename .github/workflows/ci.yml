name: CI

# Runs once per pull request head and never on a merge: `main` only receives
# merged pull requests, and the publish workflow runs the same gate through
# `prepublishOnly` before anything is uploaded. A push that supersedes a run
# on the same pull request cancels it. Markdown outside `docs/` is not ignored:
# AGENTS.md, README.md, INTENT.md and the contract fragments are read by tests.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run on Linux only; publish.yml runs the full matrix
        # (macOS and Windows included) before anything is uploaded.
        os: [ubuntu-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo's ledger lives in refs/heads/changeledger/state; a
          # single-branch checkout runs the suite against a deactivated repo
          # with no ledger (20260812-013145).
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: no ledger references outside .changeledger/
        run: |
          git fetch origin dev
          sh hooks/no-ledger-refs.sh origin/dev...HEAD
      # `activate` records its decision as a git commit (commit-tree), and
      # linux/windows runners carry no git identity to author it with.
      - run: |
          git config user.name "changeledger-ci"
          git config user.email "ci@changeledger.invalid"
      # Seeds the local state ref from the remote-tracking copy and activates
      # this checkout, so `changeledger check` validates the real ledger.
      - run: node bin/changeledger.mjs activate
      - run: node bin/changeledger.mjs register
      - run: pnpm verify

  tarball:
    name: tarball smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pack the exact published artifact and install it in an isolated dir, so
      # we exercise what npm users get — not the working tree.
      - run: pnpm pack --pack-destination /tmp
      - name: install the tarball in isolation and smoke-test the CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install /tmp/changeledger-*.tgz
          printf '# Rules\n' > AGENTS.md
          ./node_modules/.bin/changeledger --help
          ./node_modules/.bin/changeledger init
          ./node_modules/.bin/changeledger check
